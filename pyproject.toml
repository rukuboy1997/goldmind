[project]
name = "goldmind"
version = "0.1.0"
description = "Research-first AI trading intelligence system specialized in XAUUSD."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "pyarrow>=16,<22",
]

[project.optional-dependencies]
research = [
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "jupyter>=1.0,<2",
]
mt5 = [
    "MetaTrader5>=5.0.0; platform_system == "Windows"",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
